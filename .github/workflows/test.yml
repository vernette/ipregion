name: Test

on:
  push:
    paths:
      - "ipregion.sh"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shfmt bats

      - name: shellcheck
        run: shellcheck ipregion.sh tests/*.bats

      - name: shfmt
        run: shfmt --diff ipregion.sh tests/

      - name: bats
        run: bats tests/
